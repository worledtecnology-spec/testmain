<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="env.js" data-site="main"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحتوى التعليمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-main:#f0f4f4;--bg-secondary:#1b4a4a;--primary:#1b6b5a;--primary-light:#2dd4bf;--accent:#0a8545;--nav-bg:#1b5e5e;}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--bg-main);font-family:'Cairo',sans-serif;color:#1f2937;}
body{display:flex;flex-direction:column;min-height:100vh;}
.header{background:var(--bg-secondary);padding:12px 20px;text-align:center;position:relative;border-bottom:2px solid #14b8a6;min-height:58px;display:flex;align-items:center;justify-content:center;}
.header-title{font-size:14px;font-weight:700;color:#fff;max-width:70%;margin:0 auto;line-height:1.5;}
.nav{display:flex;justify-content:center;gap:8px;background:var(--nav-bg);padding:8px 16px;flex-wrap:wrap;border-bottom:2px solid #0f766e;}
.nav a{color:#e0f2f1;text-decoration:none;font-size:12px;font-weight:700;padding:5px 11px;border-radius:50px;border:2px solid rgba(167,243,208,.5);}
.nav a.active{background:#fff;color:var(--primary);border-color:#fff;}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
.box{background:#fff;border-radius:20px;max-width:520px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 18px 50px rgba(27,74,74,.15);border:1.5px solid #d1fae5;}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:12px;font-size:13.5px;font-weight:700;text-align:right;}
.done{background:#ecfdf5;color:#065f46;border:1.5px solid #6ee7b7;}
.todo{background:#f9fafb;color:#374151;border:1.5px solid #e5e7eb;}
.go{display:inline-block;background:linear-gradient(135deg,#1b6b5a,#2dd4bf);color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:11px 26px;border-radius:12px;box-shadow:0 6px 18px rgba(27,107,90,.3);}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:820px;width:100%;}
.env-card{background:#fff;border-radius:16px;padding:18px;border:2px solid #d1fae5;text-decoration:none;color:inherit;box-shadow:0 8px 24px rgba(27,74,74,.08);transition:transform .15s,border-color .15s;}
.env-card:hover{transform:translateY(-2px);border-color:#2dd4bf;}
.env-card b{display:block;font-size:16px;color:var(--primary);margin-bottom:4px;}
.env-card span{font-size:12.5px;color:#4b5563;}
@media (max-width:640px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="header">
  <div class="brand-logos" style="position:absolute;top:0;bottom:0;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;">
    <img src="img/logo-zu.png" alt="شعار جامعة الزقازيق" style="height:36px;background:#fff;border-radius:9px;padding:2px 4px;box-shadow:0 2px 8px rgba(0,0,0,.25);">
    <img src="img/logo-dept.png" alt="شعار قسم تكنولوجيا التعليم والحاسب الآلي" style="height:36px;background:#fff;border-radius:9px;padding:2px 4px;box-shadow:0 2px 8px rgba(0,0,0,.25);">
  </div>
  <div class="header-title">بيئة التعلم المدمج لتنمية مهارات إنتاج الدروس التفاعلية لدى طلاب كلية التربية النوعية</div>
</div>
<nav class="nav"></nav>
<div class="main" id="main"></div>

<script>
(function(){
  var main = document.getElementById('main');
  var C = ENV.CONFIG;

  /* نسخة التحكيم: اختيار أي نمط من الأنماط الأربعة */
  if (C.OPEN_MODE) {
    var h = '<div style="width:100%;max-width:820px;"><h2 style="text-align:center;color:#1b6b5a;margin:0 0 4px;">📖 المحتوى التعليمي — نسخة التحكيم</h2>'
          + '<p style="text-align:center;color:#6b7280;margin:0 0 16px;font-size:13px;">في نسخة الطلاب يُوجَّه كل طالب تلقائيًا لنمطه بعد اختبار أساليب التعلم. هنا يمكن للمحكّم فتح أي نمط:</p><div class="grid">';
    ['g1','g2','g3','g4'].forEach(function(k, i){
      var S = C.SITES[k];
      h += '<a class="env-card" href="' + ENV.url(k, 'mods.html') + '"><b>بيئة ' + (i+1) + ': ' + S.label + '</b><span>أسلوب التعلم: ' + S.styleLabel + '</span></a>';
    });
    main.innerHTML = h + '</div></div>';
    return;
  }

  /* نسخة الطلاب: لو النمط محدد ← افتح المحتوى مباشرة */
  var a = localStorage.getItem('assignedEnv');
  if (ENV.flag('preTestCompleted') && ENV.flag('stylesTestCompleted') && a && C.SITES[a]) {
    location.replace(ENV.url(a, 'mods.html'));
    return;
  }

  var pre = ENV.flag('preTestCompleted'), st = ENV.flag('stylesTestCompleted') && !!a;
  function row(done, t){ return '<div class="row ' + (done ? 'done' : 'todo') + '"><span style="font-size:18px;">' + (done ? '✅' : '⬜') + '</span><span>' + t + '</span></div>'; }
  main.innerHTML = '<div class="box"><div style="font-size:46px;">🔒</div>'
    + '<div style="font-size:17px;font-weight:800;color:#1b4a4a;margin-bottom:6px;">المحتوى التعليمي غير متاح بعد</div>'
    + '<div style="font-size:13px;color:#4b5563;line-height:1.8;margin-bottom:14px;">يُفتح المحتوى تلقائيًا بعد إنهاء الخطوتين بالترتيب، وتوجّهك البيئة لنمط الدعم المناسب لك:</div>'
    + row(pre, '١) الاختبار التحصيلي القبلي') + row(st, '٢) اختبار أساليب التعلم وتحديد نمط الدعم')
    + '<div style="margin-top:14px;"><a class="go" href="' + (pre ? 'trian.html' : 'befor.html') + '">' + (pre ? '🧩 اذهب لاختبار أساليب التعلم' : '📋 اذهب للاختبار التحصيلي القبلي') + '</a></div></div>';
})();
</script>
</body>
</html>
